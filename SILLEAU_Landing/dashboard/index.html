<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0c1118" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SILLEAU" />
  <title>SILLEAU · Recepție</title>

  <link rel="manifest" href="/dashboard/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="/dashboard/icon.svg" />
  <link rel="apple-touch-icon" href="/dashboard/icon-192.png" />

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/dashboard/styles.css" />
</head>
<body>
  <!-- ─────────────── LOGIN ─────────────── -->
  <section id="view-login" class="view view-login" hidden>
    <div class="login-wrap">
      <div class="login-brand">
        <div class="login-logo-mark">S</div>
        <div class="login-logo-text">SILLEAU</div>
        <div class="login-tagline">Recepție clinică</div>
      </div>
      <form id="login-form" class="login-form" novalidate>
        <label class="field">
          <span>Email</span>
          <input type="email" name="email" autocomplete="username" required />
        </label>
        <label class="field">
          <span>Parolă</span>
          <input type="password" name="password" autocomplete="current-password" required />
        </label>
        <button type="submit" class="btn-primary" id="login-submit">Intră</button>
        <div id="login-error" class="login-error" hidden></div>
      </form>
      <div class="login-foot">© SILLEAU</div>
    </div>
  </section>

  <!-- ─────────────── APP SHELL ─────────────── -->
  <section id="view-app" class="view view-app" hidden>
    <header class="app-header">
      <div class="app-header-left">
        <div class="app-logo">
          <div class="app-logo-mark">S</div>
          <div class="app-logo-text">SILLEAU</div>
        </div>
        <div class="app-clinic-nume" id="clinic-nume">—</div>
      </div>
      <button type="button" class="btn-logout" id="btn-logout" aria-label="Deconectare">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </header>

    <main class="app-main">
      <!-- TAB: CALENDAR -->
      <section id="tab-calendar" class="tab-pane" hidden>
        <div class="medic-selector" id="medic-selector"></div>

        <div class="cal-controls">
          <button type="button" class="nav-btn" id="cal-prev" aria-label="Zi anterioară">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <div class="cal-date-label" id="cal-date-label">—</div>
          <button type="button" class="nav-btn" id="cal-next" aria-label="Zi următoare">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
          <button type="button" class="btn-today" id="cal-today">Azi</button>
        </div>

        <div class="cal-legend">
          <span class="lg lg-confirmat"></span> Confirmată
          <span class="lg lg-neconfirmat"></span> Pending
          <span class="lg lg-anulat"></span> Anulată
          <span class="lg lg-noshow"></span> No-show
          <span class="lg lg-reprogramat"></span> Reprogramată
        </div>

        <div class="cal-grid" id="cal-grid">
          <div class="cal-empty" id="cal-empty">Selectează un medic pentru a vedea calendarul.</div>
        </div>
      </section>

      <!-- TAB: PACIENTI -->
      <section id="tab-pacienti" class="tab-pane" hidden>
        <div class="pac-controls">
          <div class="search-wrap">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="search" id="pac-search" placeholder="Caută după nume sau telefon…" autocomplete="off" />
          </div>
          <div class="sort-wrap">
            <label for="pac-sort">Sortare</label>
            <select id="pac-sort">
              <option value="alfabetic">Alfabetic</option>
              <option value="recent">Ultima programare</option>
            </select>
          </div>
        </div>

        <div class="pac-list" id="pac-list">
          <div class="pac-empty">Se încarcă pacienții…</div>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" role="tablist">
      <button type="button" class="nav-tab" data-tab="calendar" role="tab" aria-selected="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span>Calendar</span>
      </button>
      <button type="button" class="nav-tab" data-tab="pacienti" role="tab" aria-selected="false">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>Pacienți</span>
      </button>
    </nav>
  </section>

  <!-- Drawer detalii (programare sau pacient) -->
  <div class="drawer" id="drawer" hidden aria-hidden="true">
    <div class="drawer-backdrop" data-close="1"></div>
    <aside class="drawer-panel" role="dialog" aria-modal="true">
      <button type="button" class="drawer-close" data-close="1" aria-label="Închide">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <div class="drawer-content" id="drawer-content"></div>
    </aside>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="/dashboard/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
  <script src="/dashboard/app.js" defer></script>
</body>
</html>
