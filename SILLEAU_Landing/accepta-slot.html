<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SILLEAU — Confirmare loc disponibil</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0A0A0A;--bg2:#111111;--bd:#2A2A2A;--bd2:#333333;--acc:#E8E4DC;--txt:#F0EDE8;--dim:#888888;--mut:#555555;--wh:#FAFAF8;--err:#C45C5C;--ok:#6A9E6A;--r-btn:3px;--r-card:4px;--r-inp:3px;--sp-card:48px;--sp-row:13px;--sp-gap:28px;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;align-items:center;justify-content:center;visibility:hidden;}
    .wrap{max-width:520px;width:100%;margin:0 auto;padding:64px 24px 96px;}
    .hdr{text-align:center;margin-bottom:44px;}
    .brand{display:inline-flex;align-items:center;gap:10px;font-size:10px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);}
    .bline{width:32px;height:1px;background:var(--acc);opacity:.4;}
    .card{background:var(--bg2);border:1px solid var(--bd);border-radius:4px;padding:48px;}
    .tag{font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--mut);margin-bottom:8px;}
    .sh{font-family:'Cormorant Garamond',serif;font-size:clamp(24px,5vw,32px);font-weight:300;line-height:1.15;letter-spacing:-.02em;color:var(--wh);margin-bottom:6px;}
    .sh em{font-style:italic;}
    .ssub{font-size:13px;font-weight:300;color:var(--mut);line-height:1.7;margin-bottom:32px;}
    .section-label{font-size:9px;letter-spacing:.25em;text-transform:uppercase;color:var(--mut);margin-bottom:12px;margin-top:28px;}
    .rows{border-top:1px solid var(--bd);}
    .row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--bd);}
    .row-lbl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);}
    .row-val{font-size:13px;color:var(--acc);}
    .row-val.old{color:var(--bd2);text-decoration:line-through;}
    .sep{height:1px;background:var(--bd);margin:28px 0;}
    .btn{display:block;width:100%;padding:16px;background:var(--acc);color:var(--bg);font-size:10px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;border:none;border-radius:3px;cursor:pointer;text-align:center;font-family:'Inter',sans-serif;transition:opacity .2s;}
    .btn:hover{opacity:.85;}
    .btn:disabled{opacity:.4;cursor:not-allowed;}
    .footer{text-align:center;margin-top:32px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);}
    .footer span{color:var(--bd2);}
    .msg-card{background:var(--bg2);border:1px solid var(--bd);border-radius:4px;padding:48px;text-align:center;}
    .mark{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 28px;}
    .mark svg{width:22px;height:22px;stroke-width:1.5;fill:none;}
    .loading{text-align:center;padding:64px 0;color:var(--mut);font-size:12px;letter-spacing:.15em;text-transform:uppercase;}
    @media(max-width:480px){.card{padding:32px 20px;}.msg-card{padding:32px 20px;}.wrap{padding:40px 16px 64px;}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div class="brand"><span class="bline"></span><img class="logo-img" alt="" style="display:none;max-height:28px;max-width:120px;object-fit:contain;margin:0 6px;"><span class="brand-name">SILLEAU</span><span class="bline"></span></div>
  </div>
  <div id="content"><div class="loading">Se verifică...</div></div>
  <div class="footer">Powered by <span>SILLEAU</span> — Revenue Optimisation Systems</div>
</div>
<script>
  var p   = new URLSearchParams(location.search)
  var n   = p.get('n')   || ''
  var m   = p.get('m')   || ''
  var s   = p.get('s')   || ''
  var d   = p.get('d')   || ''
  var o   = p.get('o')   || ''
  var dp  = p.get('dp')  || ''
  var op  = p.get('op')  || ''
  var cid = p.get('cid') || ''

  var ACCEPTA_FN   = 'https://wpxflbwohowigaulhxhk.supabase.co/functions/v1/accepta-slot'
  var STARE_FN     = 'https://wpxflbwohowigaulhxhk.supabase.co/functions/v1/stare-slot'
  var PUBLIC_DATA_FN = 'https://wpxflbwohowigaulhxhk.supabase.co/functions/v1/public-data'

  function applyTheme(t, nome) {
    var r = document.documentElement;
    if(t.bg)   r.style.setProperty('--bg',  t.bg);
    if(t.bg2)  r.style.setProperty('--bg2', t.bg2);
    if(t.bg3)  r.style.setProperty('--bg3', t.bg3);
    if(t.bd)   r.style.setProperty('--bd',  t.bd);
    if(t.bd2)  r.style.setProperty('--bd2', t.bd2);
    if(t.acc)  r.style.setProperty('--acc', t.acc);
    if(t.txt)  r.style.setProperty('--txt', t.txt);
    if(t.mut)  r.style.setProperty('--mut', t.mut);
    if(t.wh)   r.style.setProperty('--wh',  t.wh);
    if(t.ok)   r.style.setProperty('--ok',  t.ok);
    if(t.err)  r.style.setProperty('--err', t.err);
    if(t.dim)  r.style.setProperty('--dim', t.dim);
    if(t.r_btn)  r.style.setProperty('--r-btn',  t.r_btn);
    if(t.r_card) r.style.setProperty('--r-card', t.r_card);
    if(t.r_inp)  r.style.setProperty('--r-inp',  t.r_inp);
    var _sp={compact:{c:'32px',r:'9px',g:'20px'},normal:{c:'48px',r:'13px',g:'28px'},spacious:{c:'64px',r:'17px',g:'36px'}};
    if(t.spacing&&_sp[t.spacing]){r.style.setProperty('--sp-card',_sp[t.spacing].c);r.style.setProperty('--sp-row',_sp[t.spacing].r);r.style.setProperty('--sp-gap',_sp[t.spacing].g);}
    if(t.font_body && t.font_body !== 'Inter') {
      var lnk = document.createElement('link');
      lnk.rel  = 'stylesheet';
      lnk.href = 'https://fonts.googleapis.com/css2?family=' + t.font_body.replace(/ /g,'+') + ':wght@300;400;500&display=swap';
      document.head.appendChild(lnk);
      document.body.style.fontFamily = "'" + t.font_body + "', sans-serif";
    }
    if(t.font_heading && t.font_heading !== 'Cormorant Garamond') {
      var lnkH = document.createElement('link');
      lnkH.rel  = 'stylesheet';
      lnkH.href = 'https://fonts.googleapis.com/css2?family=' + t.font_heading.replace(/ /g,'+') + ':ital,wght@0,300;0,400;1,300;1,400&display=swap';
      document.head.appendChild(lnkH);
      document.documentElement.style.setProperty('--font-heading', "'" + t.font_heading + "', serif");
    }
    var _hb = !!t.hide_brand;
    document.querySelectorAll('.footer').forEach(function(el){ el.style.display = _hb ? 'none' : ''; });
    var name = (t.nume_afisat || nome || '').trim();
    if(name) document.querySelectorAll('.brand-name').forEach(function(el){ el.textContent = name; });
    var _lg = r.querySelector('.logo-img');
    if(_lg){ if(t.logo_url){ _lg.src = t.logo_url; _lg.style.display = ''; } else _lg.style.display = 'none'; }
  }
  window.addEventListener('message', function(e){
    if(!e.data||e.data.type!=='silleau_theme') return;
    applyTheme(Object.assign({logo_url:e.data.logo_url},e.data.tema||{}), e.data.nome||'');
    document.body.style.visibility='visible';
  });
  function fetchAndApplyTheme(clinicId) {
    setTimeout(function(){ document.body.style.visibility='visible'; }, 2000);
    if(!clinicId) { document.body.style.visibility='visible'; return; }
    try {
      var _c = localStorage.getItem('st_'+clinicId);
      if(_c){ var _r=JSON.parse(_c); if(_r && _r._ts && Date.now()-_r._ts < 600000){ applyTheme(Object.assign({logo_url:_r.logo_url},_r.tema||{}),_r.nume_afisat||_r.nume||''); document.body.style.visibility='visible'; } }
    } catch(e){}
    fetch(PUBLIC_DATA_FN + '?resource=clinic_theme&clinic_id=' + encodeURIComponent(clinicId))
    .then(function(r){ return r.json(); })
    .then(function(list){
      var row = Array.isArray(list) ? list[0] : null;
      if(row){ try{localStorage.setItem('st_'+clinicId,JSON.stringify(Object.assign({_ts:Date.now()},row)));}catch(e){} applyTheme(Object.assign({logo_url:row.logo_url},row.tema||{}),row.nume_afisat||row.nume||''); }
      document.body.style.visibility='visible';
    })
    .catch(function(){ document.body.style.visibility='visible'; });
  }
  fetchAndApplyTheme(cid);

  function mesajUrl(tip) {
    return '/mesaj.html?tip=' + tip + (cid ? '&clinic_id=' + encodeURIComponent(cid) : '')
  }

  function esc(str) {
    var el = document.createElement('div')
    el.appendChild(document.createTextNode(str))
    return el.innerHTML
  }

  function showCard() {
    document.getElementById('content').innerHTML =
      '<div class="card">'
      + '<div class="tag">Loc disponibil mai devreme</div>'
      + '<div class="sh">Doriți să <em>mutați</em> programarea?</div>'
      + '<div class="ssub">Confirmați mai jos pentru a ocupa acest loc. Programarea dumneavoastră curentă va fi înlocuită.</div>'
      + '<div class="section-label">Loc disponibil</div>'
      + '<div class="rows">'
      + (m ? '<div class="row"><span class="row-lbl">Medic</span><span class="row-val">' + esc(m) + '</span></div>' : '')
      + (s ? '<div class="row"><span class="row-lbl">Serviciu</span><span class="row-val">' + esc(s) + '</span></div>' : '')
      + (d ? '<div class="row"><span class="row-lbl">Data</span><span class="row-val">' + esc(d) + '</span></div>' : '')
      + (o ? '<div class="row"><span class="row-lbl">Ora</span><span class="row-val">' + esc(o) + '</span></div>' : '')
      + '</div>'
      + (dp || op
        ? '<div class="section-label">Programarea dumneavoastră actuală</div>'
          + '<div class="rows">'
          + (dp ? '<div class="row"><span class="row-lbl">Data</span><span class="row-val old">' + esc(dp) + '</span></div>' : '')
          + (op ? '<div class="row"><span class="row-lbl">Ora</span><span class="row-val old">' + esc(op) + '</span></div>' : '')
          + '</div>'
        : '')
      + '<div class="sep"></div>'
      + '<button class="btn" id="btn-confirma" onclick="doConfirm()">Confirmă mutarea</button>'
      + '</div>'
  }

  function showResult(tip, titlu, sub, borderColor) {
    var icon
    if (tip === 'ok') {
      icon = '<svg viewBox="0 0 24 24" style="stroke:var(--acc)"><polyline points="20 6 9 17 4 12"/></svg>'
    } else if (tip === 'dim') {
      icon = '<span style="font-size:24px;line-height:1;color:var(--dim)">✓</span>'
    } else {
      icon = '<svg viewBox="0 0 24 24" style="stroke:var(--err)"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>'
    }
    document.getElementById('content').innerHTML =
      '<div class="msg-card">'
      + '<div class="mark" style="border:1px solid ' + borderColor + '">' + icon + '</div>'
      + '<div class="sh" style="text-align:center;margin-bottom:10px;">' + titlu + '</div>'
      + '<div class="ssub" style="text-align:center;">' + sub + '</div>'
      + '</div>'
  }

  function doConfirm() {
    if (!n) { location.href = mesajUrl('invalid'); return }
    var btn = document.getElementById('btn-confirma')
    btn.disabled = true
    btn.textContent = 'Se procesează...'

    fetch(ACCEPTA_FN, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ notificare_id: n }),
    })
    .then(function(r) { return r.json() })
    .then(function(data) {
      if (data.success) {
        showResult('ok', 'Programare <em>mutată</em>', 'Programarea dvs. a fost mutată mai devreme cu succes. Ne vedem ' + esc(d) + ', ora ' + esc(o) + '.', 'var(--acc)')
      } else if (data.reason === 'slot_acceptat') {
        showResult('ok', 'Programare deja <em>mutată</em>', 'Ați confirmat deja mutarea programării. Ne vedem ' + esc(d) + ', ora ' + esc(o) + '.', 'var(--acc)')
      } else if (data.reason === 'slot_refuzat') {
        showResult('dim', 'Programare <em>neschimbată</em>', 'Ați ales deja să păstrați programarea inițială. Ne vedem ' + esc(dp) + ', ora ' + esc(op) + '.', 'var(--dim)')
      } else {
        location.href = mesajUrl(data.reason || 'slot_ocupat')
      }
    })
    .catch(function() {
      location.href = mesajUrl('slot_ocupat')
    })
  }

  if (p.get('preview') === '1') {
    showCard(); window.parent.postMessage({type:'silleau_ready'}, '*');
  } else if (!n) {
    showResult('err', 'Link <em style="color:var(--err)">invalid</em>', 'Link-ul nu mai este valid sau lipsesc parametrii necesari.', 'var(--err)')
  } else {
    fetch(STARE_FN + '?n=' + encodeURIComponent(n))
      .then(function(r) { return r.json() })
      .then(function(state) {
        if (state.acceptat) {
          showResult('ok', 'Programare deja <em>mutată</em>', 'Ați confirmat deja mutarea programării. Ne vedem ' + esc(d) + ', ora ' + esc(o) + '.', 'var(--acc)')
        } else if (state.refused) {
          showResult('dim', 'Programare <em>neschimbată</em>', 'Ați ales deja să păstrați programarea inițială. Ne vedem ' + esc(dp) + ', ora ' + esc(op) + '.', 'var(--dim)')
        } else if (state.anulat) {
          showResult('err', 'Ofertă <em>expirată</em>', 'Acest loc nu mai este disponibil. Programarea dvs. rămâne neschimbată pe ' + esc(dp) + ', ora ' + esc(op) + '.', 'var(--err)')
        } else {
          showCard()
        }
      })
      .catch(function() { showCard() })
  }
</script>
</body>
</html>
