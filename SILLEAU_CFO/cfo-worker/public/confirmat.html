<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>SILLEAU — Cont confirmat</title>
<meta name="theme-color" content="#0c1118" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="robots" content="noindex" />

<link rel="icon" type="image/x-icon" href="/icons/favicon.ico" />
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />


<style>
  :root {
    --bg: #0c1118;
    --fg: #e8e6e3;
    --muted: #9aa4af;
    --muted2: #7f8a96;
    --muted3: #5b6470;
    --line3: rgba(232,230,227,0.18);
    --serif: 'Times New Roman', Times, serif;
    --sans: 'Times New Roman', Times, serif;
  }
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    font-weight: 400;
    line-height: 1.6;
    font-size: 15px;
    min-height: 100vh;
    min-height: 100dvh;
  }
  .screen {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
    text-align: center;
  }
  .logo {
    font-family: var(--serif);
    font-size: 24px;
    letter-spacing: 4px;
    font-weight: 500;
    color: var(--fg);
    margin-bottom: 56px;
    opacity: 0.85;
  }
  .glyph {
    font-family: var(--serif);
    font-size: 72px;
    color: var(--fg);
    opacity: 0.3;
    font-style: italic;
    line-height: 1;
    margin-bottom: 24px;
  }
  .kicker {
    font-size: 10.5px;
    color: var(--muted2);
    text-transform: uppercase;
    letter-spacing: 3.2px;
    margin-bottom: 18px;
    font-weight: 400;
  }
  h1 {
    font-family: var(--serif);
    font-size: 36px;
    font-weight: 500;
    color: var(--fg);
    line-height: 1.18;
    max-width: 520px;
    margin: 0 auto;
  }
  h1 em { font-style: italic; }
  .divider {
    width: 70px; height: 1px;
    background: var(--line3);
    margin: 28px auto;
  }
  p {
    font-size: 15px;
    color: var(--muted);
    line-height: 1.75;
    max-width: 460px;
    margin: 0 auto 12px;
    font-weight: 300;
  }
  p em { font-style: italic; color: var(--fg); font-family: var(--serif); }
  p strong { color: var(--fg); font-weight: 500; }
  .footer {
    margin-top: 64px;
    font-size: 10px;
    color: var(--muted3);
    text-transform: uppercase;
    letter-spacing: 2.8px;
  }
  @media (max-width: 560px) {
    .logo { font-size: 20px; letter-spacing: 3px; margin-bottom: 40px; }
    .glyph { font-size: 56px; }
    h1 { font-size: 26px; }
    p { font-size: 14px; }
    .footer { margin-top: 44px; }
  }
</style>
</head>
<body>
  <main class="screen">
    <div class="logo">SILLEAU</div>
    <div class="glyph">✓</div>
    <div class="kicker">Cont confirmat</div>
    <h1>Contul dumneavoastră a fost <em>creat cu succes</em>.</h1>
    <div class="divider"></div>
    <p>Puteți închide această fereastră.</p>
    <p>V-ați conectat <em>automat</em> în aplicație, pe dispozitivul unde ați început înregistrarea.</p>
    <div class="footer">Revenue Optimization Systems</div>
  </main>
</body>
</html>
